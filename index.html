<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>115學年度 課後社團報名系統</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');

        :root {
            /* 保留原變數名稱以維持 JS 相容性，替換為活潑童趣色調 */
            --primary-green: #2FBF71;   /* 草地綠 - 強調色 */
            --header-green: #1D9E63;    /* 標題綠 */
            --light-bg: #FFF4CC;        /* 陽光黃 - 卡片底色 */
            --card-bg: #FFFDF6;         /* 奶油白 */
            --text-dark: #3A3A3A;
            --text-grey: #8A8D8F;
            --white: #ffffff;
            --border-color: #FFD9A0;    /* 蜜桃橘 */
            --btn-cancel: #FFE3DC;      /* 粉橘 */

            /* 新增：童趣調色盤 */
            --sky: #5EC6F2;
            --sun: #FFD34D;
            --coral: #FF6F5E;
            --grape: #B57EE8;
            --grass: #67D28D;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Noto Sans TC', 'Helvetica Neue', Arial, sans-serif;
            background:
                radial-gradient(circle at 15% 8%, rgba(255,255,255,0.9) 0 26px, transparent 27px),
                radial-gradient(circle at 30% 5%, rgba(255,255,255,0.75) 0 18px, transparent 19px),
                radial-gradient(circle at 85% 10%, rgba(255,255,255,0.9) 0 22px, transparent 23px),
                linear-gradient(180deg, var(--sky) 0%, #BDEBFF 28%, #F2FBEF 60%, #FFF9E5 100%);
            background-attachment: fixed;
            color: var(--text-dark);
            margin: 0;
            padding: 28px 16px 60px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--white);
            max-width: 500px;
            width: 100%;
            border-radius: 28px;
            box-shadow: 0 12px 0 rgba(0,0,0,0.06), 0 18px 30px rgba(80, 60, 20, 0.12);
            border: 4px solid var(--white);
            outline: 3px dashed #FFCF8C;
            outline-offset: -14px;
            padding: 26px 22px;
            position: relative;
        }

        .header-card {
            background: linear-gradient(160deg, var(--light-bg) 0%, #FFE9B0 100%);
            border-radius: 22px;
            padding: 22px 18px 18px;
            text-align: center;
            margin-bottom: 26px;
            position: relative;
            border: 3px solid #FFE29A;
        }
        .header-card::before {
            content: '⭐';
            position: absolute;
            top: -14px;
            left: 14px;
            font-size: 22px;
            transform: rotate(-15deg);
        }
        .header-card::after {
            content: '🎈';
            position: absolute;
            top: -18px;
            right: 16px;
            font-size: 24px;
            transform: rotate(12deg);
        }
        .header-card img {
            max-height: 50px;
            margin-bottom: 8px;
            display: inline-block;
        }
        .header-card h1 {
            font-family: 'Noto Sans TC', sans-serif;
            color: var(--header-green);
            font-size: 27px;
            letter-spacing: 1px;
            margin: 5px 0 0 0;
        }
        .header-card p {
            font-family: 'Noto Sans TC', sans-serif;
            color: var(--coral);
            font-size: 21px;
            margin: 6px 0 16px 0;
            font-weight: 700;
        }
        .timer-box {
            background-color: #3A3550;
            color: white;
            border-radius: 16px;
            padding: 13px 10px;
            font-size: 17px;
            font-weight: 600;
            line-height: 1.6;
            box-shadow: inset 0 -3px 0 rgba(0,0,0,0.25);
        }
        .timer-box .icon { margin-right: 5px; display: inline-block; animation: swing 1.6s ease-in-out infinite; }
        .timer-box.active-timer { background-color: #1D9E63; }
        .timer-box.active-timer .icon { animation: bounce 1s ease-in-out infinite; }

        .progress-bar {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            margin-bottom: 30px;
            padding: 6px 0;
        }
        .step-indicator {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 14px;
            color: var(--text-grey);
            font-weight: 700;
            width: 74px;
        }
        .step-indicator.active { color: var(--header-green); }
        .step-circle {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: var(--white);
            border: 3px solid #DCE3DC;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 6px;
            color: #b9bdb9;
            font-family: 'Noto Sans TC', sans-serif;
            font-size: 20px;
            font-weight: 700;
            box-shadow: 0 3px 0 #DCE3DC;
            transition: all 0.25s;
        }
        .step-indicator.active .step-circle {
            background: linear-gradient(160deg, var(--sun), var(--coral));
            border-color: var(--coral);
            color: var(--white);
            box-shadow: 0 3px 0 #E0563E;
            transform: translateY(-2px);
        }
        .step-line {
            width: 26px;
            height: 0;
            border-top: 3px dashed #DCE3DC;
            margin: 18px 4px 0;
        }

        .step-content { display: none; animation: fadeIn 0.4s ease; }
        .step-content.active { display: block; }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            margin-bottom: 20px;
        }
        .btn-back {
            position: absolute;
            left: 0;
            background-color: var(--white);
            border: 2px solid var(--sky);
            color: #0d7bb0;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            box-shadow: 0 2px 0 #B9E4F7;
        }
        .btn-back:active { transform: translateY(2px); box-shadow: none; }
        .btn-back::before {
            content: '⬅';
            margin-right: 4px;
        }
        .section-title {
            font-family: 'Noto Sans TC', sans-serif;
            font-size: 22px;
            font-weight: 900;
            color: var(--text-dark);
            margin: 0;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
        }
        .student-card, .class-btn {
            background-color: var(--card-bg);
            border: 3px solid var(--border-color);
            border-radius: 18px;
            padding: 16px 10px;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 4px 0 var(--border-color);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        .student-card:hover, .class-btn:hover {
            transform: translateY(-3px);
            border-color: var(--primary-green);
            box-shadow: 0 6px 0 var(--primary-green);
        }
        .student-card:active, .class-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 var(--border-color);
        }
        .student-card .num {
            font-family: 'Noto Sans TC', sans-serif;
            font-size: 14px;
            color: var(--text-grey);
            margin-bottom: 5px;
        }
        .student-card .name {
            font-size: 24px;
            font-weight: bold;
            color: var(--text-dark);
        }
        .class-btn {
            font-family: 'Noto Sans TC', sans-serif;
            font-size: 22px;
            font-weight: 700;
        }
        .class-btn:nth-child(6n+1) { border-color: #FFCFC7; box-shadow: 0 4px 0 #FFCFC7; }
        .class-btn:nth-child(6n+1):hover { box-shadow: 0 6px 0 var(--coral); border-color: var(--coral); }
        .class-btn:nth-child(6n+2) { border-color: #C9EFD6; box-shadow: 0 4px 0 #C9EFD6; }
        .class-btn:nth-child(6n+2):hover { box-shadow: 0 6px 0 var(--grass); border-color: var(--grass); }
        .class-btn:nth-child(6n+3) { border-color: #BEE7F7; box-shadow: 0 4px 0 #BEE7F7; }
        .class-btn:nth-child(6n+3):hover { box-shadow: 0 6px 0 var(--sky); border-color: var(--sky); }
        .class-btn:nth-child(6n+4) { border-color: #FCE3A8; box-shadow: 0 4px 0 #FCE3A8; }
        .class-btn:nth-child(6n+4):hover { box-shadow: 0 6px 0 var(--sun); border-color: #E0AC1F; }
        .class-btn:nth-child(6n+5) { border-color: #E4D2F5; box-shadow: 0 4px 0 #E4D2F5; }
        .class-btn:nth-child(6n+5):hover { box-shadow: 0 6px 0 var(--grape); border-color: var(--grape); }

        .club-card {
            border: 3px solid var(--border-color);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
            background-color: var(--card-bg);
            cursor: pointer;
            box-shadow: 0 4px 0 var(--border-color);
            transition: transform 0.15s ease;
        }
        .club-card:hover { transform: translateY(-2px); border-color: var(--primary-green); }
        .club-card:nth-child(4n+1) { background-color: #FFF3F1; }
        .club-card:nth-child(4n+2) { background-color: #F1FBF4; }
        .club-card:nth-child(4n+3) { background-color: #F1F9FE; }
        .club-card:nth-child(4n+4) { background-color: #FBF6FF; }

        .btn-submit {
            background: linear-gradient(160deg, var(--grass), var(--header-green));
            color: var(--white);
            border: none;
            padding: 16px;
            border-radius: 16px;
            font-family: 'Noto Sans TC', sans-serif;
            font-size: 20px;
            font-weight: 900;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
            box-shadow: 0 5px 0 #0F7A47;
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }
        .btn-submit:active { transform: translateY(4px); box-shadow: 0 1px 0 #0F7A47; }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(58, 53, 80, 0.55);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-overlay.active { display: flex; }
        .modal-card {
            background-color: var(--white);
            border-radius: 24px;
            width: 90%;
            max-width: 360px;
            padding: 26px 22px;
            text-align: center;
            box-shadow: 0 14px 0 rgba(0,0,0,0.08), 0 20px 34px rgba(0,0,0,0.18);
            border: 4px solid var(--sun);
            animation: popIn 0.3s ease;
        }
        .modal-card h3 {
            font-family: 'Noto Sans TC', sans-serif;
            font-size: 25px;
            font-weight: 900;
            margin: 0 0 5px 0;
            color: var(--text-dark);
        }
        .modal-card .student-badge {
            font-size: 18px;
            font-weight: bold;
            color: var(--primary-green);
            margin-bottom: 15px;
        }
        .modal-card .desc {
            font-size: 15px;
            color: var(--text-grey);
            margin-bottom: 15px;
        }
        .modal-input {
            width: 100%;
            padding: 12px;
            border: 3px solid var(--primary-green);
            border-radius: 14px;
            font-size: 22px;
            font-family: 'Noto Sans TC', sans-serif;
            text-align: center;
            outline: none;
            margin-bottom: 25px;
            background-color: #F6FFF9;
        }
        .modal-actions {
            display: flex;
            gap: 10px;
        }
        .modal-btn {
            flex: 1;
            padding: 12px 0;
            border-radius: 14px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            border: none;
        }
        .btn-cancel {
            background-color: var(--btn-cancel);
            color: #b3503f;
        }
        .btn-confirm {
            background: linear-gradient(160deg, var(--grass), var(--header-green));
            color: var(--white);
            box-shadow: 0 4px 0 #0F7A47;
        }
        .btn-confirm:active { transform: translateY(3px); box-shadow: none; }

        #loading {
            text-align: center;
            color: var(--text-grey);
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 20px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes popIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-3px); }
        }
        @keyframes swing {
            0%, 100% { transform: rotate(-8deg); }
            50% { transform: rotate(8deg); }
        }

        @media (max-width: 380px) {
            .step-indicator { width: 58px; }
            .step-line { width: 16px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-card">
        <img src="logo.png" alt="Logo" onerror="this.style.display='none';">
        <h1>115學年度 第一學期</h1>
        <p>🎨 課後社團 報名系統 🎈</p>
        
        <div class="timer-box" id="timerBox">
            <span class="icon" id="timerIcon">⏳</span> <span id="timerStatus">載入時間中...</span><br>
            <span id="timerDisplay" style="font-family: 'Noto Sans TC', monospace; font-size: 18px;">--天 --時 --分 --秒</span>
        </div>
    </div>

    <!-- 進度條：像遊戲關卡地圖一樣的步驟指引 -->
    <div class="progress-bar">
        <div class="step-indicator active" id="indicator1">
            <div class="step-circle">🏫</div>
            <span>選班級</span>
        </div>
        <div class="step-line"></div>
        <div class="step-indicator" id="indicator2">
            <div class="step-circle">🙋</div>
            <span>點名字</span>
            <span>輸入密碼</span>
        </div>
        <div class="step-line"></div>
        <div class="step-indicator" id="indicator3">
            <div class="step-circle">🎒</div>
            <span>報名</span>
        </div>
    </div>

    <div id="loading">🎪 系統資料載入中，請稍候...</div>

    <!-- 步驟區塊 -->
    <div id="step1" class="step-content">
        <div class="section-header">
            <h2 class="section-title">🏫 請選擇班級</h2>
        </div>
        <div class="grid-container" id="classList"></div>
    </div>

    <div id="step2" class="step-content">
        <div class="section-header">
            <button class="btn-back" onclick="showStep(1)">上一頁</button>
            <h2 class="section-title" id="step2-title">班級學生名單</h2>
        </div>
        <div class="grid-container" id="studentGrid"></div>
    </div>

    <div id="step3" class="step-content">
        <div class="section-header">
            <button class="btn-back" onclick="showStep(2)">上一頁</button>
            <h2 class="section-title">🎒 選社團囉 (可多選)</h2>
        </div>
        <div id="clubList"></div>
        <button class="btn-submit" onclick="submitForm()">🚀 確認送出 (可再次修改)</button>
    </div>

    <div id="step-success" class="step-content" style="text-align: center; padding: 30px 0;">
        <div style="font-size: 52px; margin-bottom: 6px;">🎉</div>
        <h2 style="font-family: 'Noto Sans TC', sans-serif; font-weight: 900; font-size: 24px; color: var(--header-green);">報名資料已送出！</h2>
        <p style="font-size: 16px; color: var(--text-grey); margin-bottom: 25px;">若需修改資料，請重新登入並再次送出即可覆蓋舊資料。</p>
        <button class="btn-submit" onclick="location.reload()">🏠 回首頁</button>
    </div>
</div>

<!-- 身分驗證彈跳視窗 -->
<div class="modal-overlay" id="authModal">
    <div class="modal-card">
        <div style="font-size: 34px; margin-bottom: 4px;">🔑</div>
        <h3>身分驗證</h3>
        <div class="student-badge" id="modalStudentName">101 班 陳士軒</div>
        <div class="desc">請輸入密碼(生日4碼) (password)</div>
        <input type="password" id="modalPassword" class="modal-input" placeholder="••••" onkeypress="if(event.key==='Enter') confirmAuth()">
        <div class="modal-actions">
            <button class="modal-btn btn-cancel" onclick="closeAuthModal()">取消</button>
            <button class="modal-btn btn-confirm" onclick="confirmAuth()">確認進入</button>
        </div>
    </div>
</div>

<script>
    // 確保填入正確的 Apps Script Web App URL
    const API_URL = "https://script.google.com/macros/s/AKfycbxk2YLVQFU6SGPMk-gsjlvA7gbSOhybLWH5dhmdCmArGAp4_MsByIMS2hM9NNIKcUXtGg/exec"; 
    
    let globalData = {};
    let currentClass = "";
    let currentStudent = null;
    let verifiedPassword = "";
    let isRegistrationOpen = false;

    // 取得資料
    fetch(API_URL + "?action=getInitialData", { redirect: 'follow' })
        .then(res => res.text()) 
        .then(text => {
            try {
                const data = JSON.parse(text); 
                globalData = data;
                document.getElementById('loading').style.display = 'none';
                
                startTimer(globalData.settings.startTime, globalData.settings.endTime);
                renderClasses();
                showStep(1);
            } catch (err) {
                document.getElementById('loading').innerHTML = `
                    <div style='color:red; margin-bottom:10px;'>⚠️ 讀取資料失敗！</div>
                    <div style='font-size:16px; color:#555;'>請確認您的 Apps Script 是否有按「<b>建立新版本部署</b>」。</div>
                `;
            }
        })
        .catch(err => {
            document.getElementById('loading').innerHTML = "<span style='color:red;'>⚠️ 網路連線失敗！請確認 API 網址是否正確。</span>";
        });

    function startTimer(startStr, endStr) {
        const startTime = new Date(startStr).getTime();
        const endTime = new Date(endStr).getTime();
        const statusEl = document.getElementById('timerStatus');
        const displayEl = document.getElementById('timerDisplay');
        const iconEl = document.getElementById('timerIcon');
        const boxEl = document.getElementById('timerBox');

        if (isNaN(startTime) || isNaN(endTime)) {
            statusEl.innerText = "時間設定錯誤";
            displayEl.innerText = "請檢查後端時間格式";
            return;
        }

        setInterval(() => {
            const now = new Date().getTime();
            let targetTime = 0;

            if (now < startTime) {
                isRegistrationOpen = false;
                statusEl.innerText = "距離報名開始還有";
                iconEl.innerText = "🚫";
                boxEl.classList.remove('active-timer');
                targetTime = startTime;
            } else if (now >= startTime && now <= endTime) {
                isRegistrationOpen = true;
                statusEl.innerText = "報名進行中！距離結束尚有";
                iconEl.innerText = "✅";
                boxEl.classList.add('active-timer');
                targetTime = endTime;
            } else {
                isRegistrationOpen = false;
                statusEl.innerText = "報名已截止";
                iconEl.innerText = "🛑";
                boxEl.classList.remove('active-timer');
                displayEl.innerText = "00天 00時 00分 00秒";
                return;
            }

            const diff = targetTime - now;
            if (diff > 0) {
                const d = Math.floor(diff / (1000 * 60 * 60 * 24));
                const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                const s = Math.floor((diff % (1000 * 60)) / 1000);
                
                displayEl.innerText = 
                    String(d).padStart(2, '0') + "天 " +
                    String(h).padStart(2, '0') + "時 " +
                    String(m).padStart(2, '0') + "分 " +
                    String(s).padStart(2, '0') + "秒";
            }
        }, 1000);
    }

    function updateProgress(stepNumber) {
        document.querySelectorAll('.step-indicator').forEach((el, index) => {
            if (index < stepNumber) {
                el.classList.add('active');
            } else {
                el.classList.remove('active');
            }
        });
    }

    function showStep(stepNumber) {
        document.querySelectorAll('.step-content').forEach(el => el.classList.remove('active'));
        document.getElementById('step' + stepNumber).classList.add('active');
        updateProgress(stepNumber);
    }

    function renderClasses() {
        const classContainer = document.getElementById('classList');
        const classes = Object.keys(globalData.students).sort();
        
        classes.forEach(cls => {
            const div = document.createElement('div');
            div.className = 'class-btn';
            div.innerText = cls + ' 班';
            div.onclick = () => selectClass(cls);
            classContainer.appendChild(div);
        });
    }

    function selectClass(cls) {
        if (!isRegistrationOpen) return alert("目前非報名開放時間！");
        currentClass = cls;
        currentStudent = null;
        document.getElementById('step2-title').innerText = cls + ' 班學生名單';
        
        const grid = document.getElementById('studentGrid');
        grid.innerHTML = '';
        
        globalData.students[cls].forEach(student => {
            const card = document.createElement('div');
            card.className = 'student-card';
            // 將座號補0顯示 (如 01號, 02號)
            card.innerHTML = `
                <div class="num">${String(student.num).padStart(2, '0')}號</div>
                <div class="name">${student.name}</div>
            `;
            card.onclick = () => openAuthModal(student);
            grid.appendChild(card);
        });
        showStep(2);
    }

    function openAuthModal(student) {
        currentStudent = student;
        document.getElementById('modalStudentName').innerText = `${currentClass} 班 ${student.name}`;
        const pwdInput = document.getElementById('modalPassword');
        pwdInput.value = '';
        document.getElementById('authModal').classList.add('active');
        setTimeout(() => pwdInput.focus(), 150);
    }

    function closeAuthModal() {
        document.getElementById('authModal').classList.remove('active');
    }

    function confirmAuth() {
        const pwd = document.getElementById('modalPassword').value.trim();
        if (!pwd) return alert("請輸入密碼！");
        verifiedPassword = pwd;
        closeAuthModal();
        renderClubs(currentStudent.grade);
        showStep(3);
    }

    function renderClubs(studentGrade) {
        const clubContainer = document.getElementById('clubList');
        clubContainer.innerHTML = '';
        
        let availableClubs = globalData.clubs.filter(club => club.target.includes(studentGrade));
        if (availableClubs.length === 0) {
            clubContainer.innerHTML = '<p style="text-align:center; color:#888;">目前沒有適合您年級的社團。</p>';
            return;
        }

        // ============================================
        // 抓取該生過去的報名紀錄 (轉為統一數字比對)
        // ============================================
        const studentKey = currentClass + "_" + Number(currentStudent.num);
        const pastSelections = globalData.registrations && globalData.registrations[studentKey] 
                                ? globalData.registrations[studentKey] : [];

        availableClubs.forEach((club) => {
            const isChecked = pastSelections.includes(club.name) ? 'checked' : '';

            const div = document.createElement('div');
            div.className = 'club-card';
            // 將社團的「星期幾 (club.day)」透過 data-day 綁定在 input 標籤上
            div.innerHTML = `
                <label style="cursor:pointer; display:flex; align-items:flex-start;">
                    <input type="checkbox" name="clubChoice" value="${club.name}" data-day="${club.day}" ${isChecked} style="width:18px; height:18px; margin-right:12px; margin-top:3px;">
                    <div>
                        <h3 style="margin: 0 0 5px 0; color: var(--header-green); font-size: 18px;">${club.name}</h3>
                        <p style="margin: 0 0 5px 0; font-size: 15px; color: #666;">星期${club.day} | 費用: ${club.fee} | 老師: ${club.teacher}</p>
                        <p style="margin: 0; font-size: 14px; color: #888;">${club.desc}</p>
                    </div>
                </label>
            `;
            clubContainer.appendChild(div);
        });
    }

    function submitForm() {
        if (!isRegistrationOpen) return alert("報名時間已截止！");

        const selectedCheckboxes = document.querySelectorAll('input[name="clubChoice"]:checked');
        if (selectedCheckboxes.length === 0) return alert("請至少選擇一個社團！");
        
        // ============================================
        // 同一星期防呆檢查：阻止報名衝突的時段
        // ============================================
        const selectedDays = [];
        const selectedClubsArray = [];
        
        for (let cb of selectedCheckboxes) {
            const day = cb.getAttribute('data-day'); // 取出星期幾
            if (selectedDays.includes(day)) {
                return alert(`⚠️ 發生時段衝突！\n您重複選擇了「星期${day}」的社團，每天只能報名一個。`);
            }
            selectedDays.push(day);
            selectedClubsArray.push(cb.value);
        }

        const payload = {
            cls: currentClass,
            num: currentStudent.num,
            name: currentStudent.name,
            pwd: verifiedPassword,
            selectedClubs: selectedClubsArray
        };

        document.getElementById('step3').innerHTML = '<h2 style="text-align:center; color:var(--text-grey);">資料處理中，請稍候...</h2>';

        fetch(API_URL, {
            method: 'POST',
            body: JSON.stringify(payload)
        })
        .then(res => res.json())
        .then(data => {
            if (data.status === 'success') {
                document.querySelectorAll('.step-content').forEach(el => el.classList.remove('active'));
                document.getElementById('step-success').classList.add('active');
            } else {
                alert(data.message); 
                location.reload();
            }
        })
        .catch(err => {
            alert("系統發生錯誤，請稍後再試。");
            console.error(err);
        });
    }
</script>

</body>
</html>
