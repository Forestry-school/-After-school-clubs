<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>115學年度 課後社團報名系統</title>
    <style>
        :root {
            --primary-green: #0d8253;
            --header-green: #2c5a3d;
            --light-bg: #eef2ed;
            --card-bg: #fcfbf7;
            --text-dark: #333333;
            --text-grey: #8a8d8f;
            --white: #ffffff;
            --border-color: #e5e5e5;
            --btn-cancel: #edf2f7;
        }
        body {
            font-family: 'Helvetica Neue', Arial, '微軟正黑體', sans-serif;
            background-color: #f4f7f4;
            color: var(--text-dark);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background-color: var(--white);
            max-width: 500px;
            width: 100%;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            padding: 25px;
            box-sizing: border-box;
            position: relative;
        }

        /* 頂部資訊卡片 */
        .header-card {
            background-color: var(--light-bg);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            margin-bottom: 25px;
        }
        .header-card img {
            max-height: 50px;
            margin-bottom: 8px;
            display: inline-block;
        }
        .header-card h1 {
            color: var(--header-green);
            font-size: 20px;
            margin: 5px 0 0 0;
        }
        .header-card p {
            color: var(--header-green);
            font-size: 14px;
            margin: 5px 0 15px 0;
            font-weight: bold;
        }
        .timer-box {
            background-color: #2b2b2b;
            color: white;
            border-radius: 10px;
            padding: 10px;
            font-size: 14px;
            font-weight: bold;
            line-height: 1.5;
        }
        .timer-box .icon { margin-right: 5px; }

        /* 進度條 */
        .progress-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 30px;
        }
        .step-indicator {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 12px;
            color: var(--text-grey);
            font-weight: bold;
        }
        .step-indicator.active { color: var(--header-green); }
        .step-circle {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background-color: var(--white);
            border: 2px solid #ccc;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 5px;
            color: #ccc;
        }
        .step-indicator.active .step-circle {
            background-color: var(--header-green);
            border-color: var(--header-green);
            color: var(--white);
        }
        .step-line {
            width: 40px;
            height: 2px;
            background-color: #ccc;
            margin: 0 10px;
            transform: translateY(-10px);
        }

        /* 內容區塊 */
        .step-content { display: none; animation: fadeIn 0.4s ease; }
        .step-content.active { display: block; }

        /* 返回按鈕與標題 */
        .section-header {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            margin-bottom: 20px;
        }
        .btn-back {
            position: absolute;
            left: 0;
            background-color: #f0f4f8;
            border: 1px solid #d1d9e0;
            color: #333;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
        }
        .btn-back::before {
            content: '⬅';
            color: #0056b3;
            margin-right: 4px;
        }
        .section-title {
            font-size: 18px;
            font-weight: bold;
            color: var(--text-dark);
            margin: 0;
        }

        /* 卡片網格 */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        .student-card, .class-btn {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 15px 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .student-card:hover, .class-btn:hover { border-color: var(--primary-green); }
        .student-card .num {
            font-size: 12px;
            color: var(--text-grey);
            margin-bottom: 5px;
        }
        .student-card .name {
            font-size: 20px;
            font-weight: bold;
            color: var(--text-dark);
        }
        .class-btn {
            font-size: 18px;
            font-weight: bold;
        }

        /* 社團清單卡片 */
        .club-card {
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 10px;
            background-color: var(--card-bg);
            cursor: pointer;
        }
        .club-card:hover { border-color: var(--primary-green); }

        .btn-submit {
            background-color: var(--header-green);
            color: var(--white);
            border: none;
            padding: 15px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
        }
        .btn-submit:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }

        /* 彈跳視窗 (Modal) 樣式 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.45);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-overlay.active { display: flex; }
        .modal-card {
            background-color: var(--white);
            border-radius: 20px;
            width: 90%;
            max-width: 360px;
            padding: 25px 20px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            animation: popIn 0.3s ease;
        }
        .modal-card h3 {
            font-size: 20px;
            margin: 0 0 5px 0;
            color: var(--text-dark);
        }
        .modal-card .student-badge {
            font-size: 16px;
            font-weight: bold;
            color: var(--primary-green);
            margin-bottom: 15px;
        }
        .modal-card .desc {
            font-size: 13px;
            color: var(--text-grey);
            margin-bottom: 15px;
        }
        .modal-input {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--primary-green);
            border-radius: 10px;
            font-size: 20px;
            text-align: center;
            box-sizing: border-box;
            outline: none;
            margin-bottom: 25px;
        }
        .modal-actions {
            display: flex;
            gap: 10px;
        }
        .modal-btn {
            flex: 1;
            padding: 12px 0;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border: none;
        }
        .btn-cancel {
            background-color: var(--btn-cancel);
            color: #4a5568;
        }
        .btn-confirm {
            background-color: var(--primary-green);
            color: var(--white);
        }

        #loading { text-align: center; color: var(--text-grey); font-weight: bold; margin-bottom: 20px; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes popIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>

        <button class="btn-submit" onclick="location.reload()">回首頁</button>
    </div>
</div>

<!-- 身分驗證彈跳視窗 -->
<div class="modal-overlay" id="authModal">

    // ====== 計時器核心邏輯 ======
    function startTimer(startStr, endStr) {

        const timerText = document.getElementById('timerText');

                updateCountdownString(countdownEl, endTime - now);
                submitBtn.disabled = false;
                submitBtn.innerText = "確認送出 (可再次修改)";

                timerIcon.style.color = "#ff4d4d";
                timerText.innerText = "報名已截止";
                countdownEl.innerText = "00天 00時 00分 00秒";
                submitBtn.disabled = true;
                submitBtn.innerText = "已逾報名時間";
                clearInterval(timerInterval);
            }
        }, 1000);
    }

        const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((這兩個問題非常關鍵！手動拆分資料確實太花時間了，我們直接讓程式幫您把社團**分配到獨立的欄位**中（例如 E欄放志願1、F欄放志願2...）。

同時，我也幫您把**倒數計時器**寫好，它現在會去抓取您 Google Sheet 「系統設定」表單中的時間，並且動態倒數，標題也為您更正為「課後社團報名系統」。

請依照以下步驟分別更新您的 **後端 (`code.gs`)** 與 **前端 (HTML)**：

### 1. 更新 Google Apps Script (`code.gs`)
我們需要修改 `doPost` 的儲存邏輯，將陣列拆開並寫入多個欄位。請將您的 `code.gs` 完整替換為以下程式碼：

```javascript
const SCRIPT_PROP = PropertiesService.getScriptProperties();

function setup() {
  const doc = SpreadsheetApp.getActiveSpreadsheet();
  SCRIPT_PROP.setProperty("key", doc.getId());
}

// 處理前端抓取資料的請求 (GET)
function doGet(e) {
  const doc = SpreadsheetApp.openById(SCRIPT_PROP.getProperty("key"));
  
  // 取得系統設定
  const settingSheet = doc.getSheetByName("系統設定");
  const settings = {
    startTime: settingSheet.getRange("B1").getValue(), // 必須是有效日期格式
    endTime: settingSheet.getRange("B2").getValue()    // 必須是有效日期格式
  };
  
  // 取得學生名單
  const studentSheet = doc.getSheetByName("學生名單");
  const studentData = studentSheet.getDataRange().getValues();
  const students = {};
  for (let i = 1; i < studentData.length; i++) {
    let cls = studentData[i][0];
    if (!students[cls]) students[cls] = [];
    students[cls].push({
      num: studentData[i][1],
      name: studentData[i][2],
      grade: studentData[i][3],
      pwd: studentData[i][4]
    });
  }
  
  // 取得社團總表
  const clubSheet = doc.getSheetByName("社團總表");
  const clubData = clubSheet.getDataRange().getValues();
  const clubs = [];
  for (let i = 1; i < clubData.length; i++) {
    clubs.push({
      name: clubData[i][0],
      day: clubData[i][1],
      target: String(clubData[i][2]), 
      desc: clubData[i][3],
      fee: clubData[i][4],
      limit: clubData[i][5],
      teacher: clubData[i][6],
      room: clubData[i][7]
    });
  }

  const result = {
    settings: settings,
    students: students,
    clubs: clubs
  };

  return ContentService
    .createTextOutput(JSON.stringify(result))
    .setMimeType(ContentService.MimeType.JSON);
}

// 處理前端送出的報名資料 (POST)
function doPost(e) {
  const doc = SpreadsheetApp.openById(SCRIPT_PROP.getProperty("key"));
  const resultSheet = doc.getSheetByName("報名結果");
  const studentSheet = doc.getSheetByName("學生名單");
  
  try {
    const data = JSON.parse(e.postData.contents);
    
    // 1. 驗證密碼
    const studentData = studentSheet.getDataRange().getValues();
    let isValid = false;
    for (let i = 1; i < studentData.length; i++) {
      if (studentData[i][0] == data.cls && studentData[i][1] == data.num) {
        if (String(studentData[i][4]) === String(data.pwd)) {
          isValid = true;
          break;
        }
      }
    }
    
    if (!isValid) {
      return ContentService.createTextOutput(JSON.stringify({status: "error", message: "密碼驗證失敗！"})).setMimeType(ContentService.MimeType.JSON);
    }
    
    // ======== 將社團陣列拆開 (解決手工拆分的問題) ========
    let clubsToSave = data.selectedClubs;
    if (!Array.isArray(clubsToSave)) {
      clubsToSave = [clubsToSave];
    }
    
    // 2. 寫入或修改報名結果
    const existingData = resultSheet.getDataRange().getValues();
    let updated = false;
    const timestamp = new Date();
    
    for (let i = 1; i < existingData.length; i++) {
      if (existingData[i][1] == data.cls && existingData[i][2] == data.num) {
        resultSheet.getRange(i + 1, 1).setValue(timestamp);
        // 先清除舊的社團資料 (假設最多報名15個，清空第5到第20欄)
        resultSheet.getRange(i + 1, 5, 1, 15).clearContent();
        // 將新的社團陣列一次性寫入多個欄位
        if(clubsToSave.length > 0) {
          resultSheet.getRange(i + 1, 5, 1, clubsToSave.length).setValues([clubsToSave]);
        }
        updated = true;
        break;
      }
    }
    
    // 如果沒有舊紀錄，則新增一行 (使用展開運算子 ...clubsToSave 自動拆成多欄)
    if (!updated) {
      let rowData = [timestamp, data.cls, data.num, data.name, ...clubsToSave];
      resultSheet.appendRow(rowData);
    }
    
    return ContentService.createTextOutput(JSON.stringify({status: "success", message: "報名成功！"})).setMimeType(ContentService.MimeType.JSON);
    
  } catch (error) {
    return ContentService.createTextOutput(JSON.stringify({status: "error", message: error.toString()})).setMimeType(ContentService.MimeType.JSON);
  }
}
