<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>115學年度 課後社團報名系統</title>
    <style>
        :root {
            --primary-green: #0d8253;
            --header-green: #2c5a3d;
            --light-bg: #eef2ed;
            --card-bg: #fcfbf7;
            --text-dark: #333333;
            --text-grey: #8a8d8f;
            --white: #ffffff;
            --border-color: #e5e5e5;
            --btn-cancel: #edf2f7;
        }
        body {
            font-family: 'Helvetica Neue', Arial, '微軟正黑體', sans-serif;
            background-color: #f4f7f4;
            color: var(--text-dark);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background-color: var(--white);
            max-width: 500px;
            width: 100%;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            padding: 25px;
            box-sizing: border-box;
            position: relative;
        }

        .header-card {
            background-color: var(--light-bg);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            margin-bottom: 25px;
        }
        .header-card img {
            max-height: 50px;
            margin-bottom: 8px;
            display: inline-block;
        }
        .header-card h1 {
            color: var(--header-green);
            font-size: 20px;
            margin: 5px 0 0 0;
        }
        .header-card p {
            color: var(--header-green);
            font-size: 16px;
            margin: 5px 0 15px 0;
            font-weight: bold;
        }
        .timer-box {
            background-color: #2b2b2b;
            color: white;
            border-radius: 10px;
            padding: 10px;
            font-size: 14px;
            font-weight: bold;
            line-height: 1.5;
        }
        .timer-box .icon { color: #ff4d4d; margin-right: 5px; }
        .timer-box.active-timer .icon { color: #0d8253; } 

        .progress-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 30px;
        }
        .step-indicator {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 12px;
            color: var(--text-grey);
            font-weight: bold;
        }
        .step-indicator.active { color: var(--header-green); }
        .step-circle {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background-color: var(--white);
            border: 2px solid #ccc;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 5px;
            color: #ccc;
        }
        .step-indicator.active .step-circle {
            background-color: var(--header-green);
            border-color: var(--header-green);
            color: var(--white);
        }
        .step-line {
            width: 40px;
            height: 2px;
            background-color: #ccc;
            margin: 0 10px;
            transform: translateY(-10px);
        }

        .step-content { display: none; animation: fadeIn 0.4s ease; }
        .step-content.active { display: block; }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            margin-bottom: 20px;
        }
        .btn-back {
            position: absolute;
            left: 0;
            background-color: #f0f4f8;
            border: 1px solid #d1d9e0;
            color: #333;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
        }
        .btn-back::before {
            content: '⬅';
            color: #0056b3;
            margin-right: 4px;
        }
        .section-title {
            font-size: 18px;
            font-weight: bold;
            color: var(--text-dark);
            margin: 0;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        .student-card, .class-btn {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 15px 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .student-card:hover, .class-btn:hover { border-color: var(--primary-green); }
        .student-card .num {
            font-size: 12px;
            color: var(--text-grey);
            margin-bottom: 5px;
        }
        .student-card .name {
            font-size: 20px;
            font-weight: bold;
            color: var(--text-dark);
        }
        .class-btn {
            font-size: 18px;
            font-weight: bold;
        }

        .club-card {
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 10px;
            background-color: var(--card-bg);
            cursor: pointer;
        }
        .club-card:hover { border-color: var(--primary-green); }

        .btn-submit {
            background-color: var(--header-green);
            color: var(--white);
            border: none;
            padding: 15px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.45);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-overlay.active { display: flex; }
        .modal-card {
            background-color: var(--white);
            border-radius: 20px;
            width: 90%;
            max-width: 360px;
            padding: 25px 20px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            animation: popIn 0.3s ease;
        }
        .modal-card h3 {
            font-size: 20px;
            margin: 0 0 5px 0;
            color: var(--text-dark);
        }
        .modal-card .student-badge {
            font-size: 16px;
            font-weight: bold;
            color: var(--primary-green);
            margin-bottom: 15px;
        }
        .modal-card .desc {
            font-size: 13px;
            color: var(--text-grey);
            margin-bottom: 15px;
        }
        .modal-input {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--primary-green);
            border-radius: 10px;
            font-size: 20px;
            text-align: center;
            box-sizing: border-box;
            outline: none;
            margin-bottom: 25px;
        }
        .modal-actions {
            display: flex;
            gap: 10px;
        }
        .modal-btn {
            flex: 1;
            padding: 12px 0;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border: none;
        }
        .btn-cancel {
            background-color: var(--btn-cancel);
            color: #4a5568;
        }
        .btn-confirm {
            background-color: var(--primary-green);
            color: var(--white);
        }

        #loading { text-align: center; color: var(--text-grey); font-weight: bold; margin-bottom: 20px; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes popIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-card">
        <img src="logo.png" alt="Logo" onerror="this.style.display='none';">
        <h1>115學年度 第一學期</h1>
        <p>課後社團 報名系統</p>
        
        <div class="timer-box" id="timerBox">
            <span class="icon" id="timerIcon">⏳</span> <span id="timerStatus">載入時間中...</span><br>
            <span id="timerDisplay" style="font-family: monospace; font-size: 16px;">--天 --時 --分 --秒</span>
        </div>
    </div>

    <!-- 進度條 -->
    <div class="progress-bar">
        <div class="step-indicator active" id="indicator1">
            <div class="step-circle">1</div>
            <span>選班級</span>
        </div>
        <div class="step-line"></div>
        <div class="step-indicator" id="indicator2">
            <div class="step-circle">2</div>
            <span>點名字</span>
        </div>
        <div class="step-line"></div>
        <div class="step-indicator" id="indicator3">
            <div class="step-circle">3</div>
            <span>排志願</span>
        </div>
    </div>

    <div id="loading">系統資料載入中，請稍候...</div>

    <!-- 步驟區塊 -->
    <div id="step1" class="step-content">
        <div class="section-header">
            <h2 class="section-title">請選擇班級</h2>
        </div>
        <div class="grid-container" id="classList"></div>
    </div>

    <div id="step2" class="step-content">
        <div class="section-header">
            <button class="btn-back" onclick="showStep(1)">上一頁</button>
            <h2 class="section-title" id="step2-title">班級學生名單</h2>
        </div>
        <div class="grid-container" id="studentGrid"></div>
    </div>

    <div id="step3" class="step-content">
        <div class="section-header">
            <button class="btn-back" onclick="showStep(2)">上一頁</button>
            <h2 class="section-title">請選擇課後社團 (可多選)</h2>
        </div>
        <div id="clubList"></div>
        <button class="btn-submit" onclick="submitForm()">確認送出 (可再次修改)</button>
    </div>

    <div id="step-success" class="step-content" style="text-align: center; padding: 30px 0;">
        <h2 style="color: var(--header-green);">報名資料已送出！</h2>
        <p style="color: var(--text-grey); margin-bottom: 25px;">若需修改志願，請重新登入並再次送出即可覆蓋舊資料。</p>
        <button class="btn-submit" onclick="location.reload()">回首頁</button>
    </div>
</div>

<!-- 身分驗證彈跳視窗 -->
<div class="modal-overlay" id="authModal">
    <div class="modal-card">
        <h3>身分驗證</h3>
        <div class="student-badge" id="modalStudentName">101 班 陳士軒</div>
        <div class="desc">請輸入驗證密碼 (password)</div>
        <input type="password" id="modalPassword" class="modal-input" placeholder="••••" onkeypress="if(event.key==='Enter') confirmAuth()">
        <div class="modal-actions">
            <button class="modal-btn btn-cancel" onclick="closeAuthModal()">取消</button>
            <button class="modal-btn btn-confirm" onclick="confirmAuth()">確認進入</button>
        </div>
    </div>
</div>

<script>
    // 確保填入正確的 Apps Script Web App URL
    const API_URL = "https://script.google.com/macros/s/AKfycbxk2YLVQFU6SGPMk-gsjlvA7gbSOhybLWH5dhmdCmArGAp4_MsByIMS2hM9NNIKcUXtGg/exec"; 
    
    let globalData = {};
    let currentClass = "";
    let currentStudent = null;
    let verifiedPassword = "";
    let isRegistrationOpen = false;

    // 取得資料
    fetch(API_URL + "?action=getInitialData", { redirect: 'follow' })
        .then(res => res.text()) 
        .then(text => {
            try {
                const data = JSON.parse(text); 
                globalData = data;
                document.getElementById('loading').style.display = 'none';
                
                startTimer(globalData.settings.startTime, globalData.settings.endTime);
                renderClasses();
                showStep(1);
            } catch (err) {
                document.getElementById('loading').innerHTML = `
                    <div style='color:red; margin-bottom:10px;'>⚠️ 讀取資料失敗！</div>
                    <div style='font-size:14px; color:#555;'>請確認您的 Apps Script 是否有按「<b>建立新版本部署</b>」。</div>
                `;
            }
        })
        .catch(err => {
            document.getElementById('loading').innerHTML = "<span style='color:red;'>⚠️ 網路連線失敗！請確認 API 網址是否正確。</span>";
        });

    function startTimer(startStr, endStr) {
        const startTime = new Date(startStr).getTime();
        const endTime = new Date(endStr).getTime();
        const statusEl = document.getElementById('timerStatus');
        const displayEl = document.getElementById('timerDisplay');
        const iconEl = document.getElementById('timerIcon');
        const boxEl = document.getElementById('timerBox');

        if (isNaN(startTime) || isNaN(endTime)) {
            statusEl.innerText = "時間設定錯誤";
            displayEl.innerText = "請檢查後端時間格式";
            return;
        }

        setInterval(() => {
            const now = new Date().getTime();
            let targetTime = 0;

            if (now < startTime) {
                isRegistrationOpen = false;
                statusEl.innerText = "距離報名開始還有";
                iconEl.innerText = "🚫";
                boxEl.classList.remove('active-timer');
                targetTime = startTime;
            } else if (now >= startTime && now <= endTime) {
                isRegistrationOpen = true;
                statusEl.innerText = "報名進行中！距離結束尚有";
                iconEl.innerText = "✅";
                boxEl.classList.add('active-timer');
                targetTime = endTime;
            } else {
                isRegistrationOpen = false;
                statusEl.innerText = "報名已截止";
                iconEl.innerText = "🛑";
                boxEl.classList.remove('active-timer');
                displayEl.innerText = "00天 00時 00分 00秒";
                return;
            }

            const diff = targetTime - now;
            if (diff > 0) {
                const d = Math.floor(diff / (1000 * 60 * 60 * 24));
                const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                const s = Math.floor((diff % (1000 * 60)) / 1000);
                
                displayEl.innerText = 
                    String(d).padStart(2, '0') + "天 " +
                    String(h).padStart(2, '0') + "時 " +
                    String(m).padStart(2, '0') + "分 " +
                    String(s).padStart(2, '0') + "秒";
            }
        }, 1000);
    }

    function updateProgress(stepNumber) {
        document.querySelectorAll('.step-indicator').forEach((el, index) => {
            if (index < stepNumber) {
                el.classList.add('active');
            } else {
                el.classList.remove('active');
            }
        });
    }

    function showStep(stepNumber) {
        document.querySelectorAll('.step-content').forEach(el => el.classList.remove('active'));
        document.getElementById('step' + stepNumber).classList.add('active');
        updateProgress(stepNumber);
    }

    function renderClasses() {
        const classContainer = document.getElementById('classList');
        const classes = Object.keys(globalData.students).sort();
        
        classes.forEach(cls => {
            const div = document.createElement('div');
            div.className = 'class-btn';
            div.innerText = cls + ' 班';
            div.onclick = () => selectClass(cls);
            classContainer.appendChild(div);
        });
    }

    function selectClass(cls) {
        if (!isRegistrationOpen) return alert("目前非報名開放時間！");
        currentClass = cls;
        currentStudent = null;
        document.getElementById('step2-title').innerText = cls + ' 班學生名單';
        
        const grid = document.getElementById('studentGrid');
        grid.innerHTML = '';
        
        globalData.students[cls].forEach(student => {
            const card = document.createElement('div');
            card.className = 'student-card';
            // 將座號補0顯示 (如 01號, 02號)
            card.innerHTML = `
                <div class="num">${String(student.num).padStart(2, '0')}號</div>
                <div class="name">${student.name}</div>
            `;
            card.onclick = () => openAuthModal(student);
            grid.appendChild(card);
        });
        showStep(2);
    }

    function openAuthModal(student) {
        currentStudent = student;
        document.getElementById('modalStudentName').innerText = `${currentClass} 班 ${student.name}`;
        const pwdInput = document.getElementById('modalPassword');
        pwdInput.value = '';
        document.getElementById('authModal').classList.add('active');
        setTimeout(() => pwdInput.focus(), 150);
    }

    function closeAuthModal() {
        document.getElementById('authModal').classList.remove('active');
    }

    function confirmAuth() {
        const pwd = document.getElementById('modalPassword').value.trim();
        if (!pwd) return alert("請輸入密碼！");
        verifiedPassword = pwd;
        closeAuthModal();
        renderClubs(currentStudent.grade);
        showStep(3);
    }

    function renderClubs(studentGrade) {
        const clubContainer = document.getElementById('clubList');
        clubContainer.innerHTML = '';
        
        let availableClubs = globalData.clubs.filter(club => club.target.includes(studentGrade));
        if (availableClubs.length === 0) {
            clubContainer.innerHTML = '<p style="text-align:center; color:#888;">目前沒有適合您年級的社團。</p>';
            return;
        }

        // ============================================
        // 抓取該生過去的報名紀錄 (轉為統一數字比對)
        // ============================================
        const studentKey = currentClass + "_" + Number(currentStudent.num);
        const pastSelections = globalData.registrations && globalData.registrations[studentKey] 
                                ? globalData.registrations[studentKey] : [];

        availableClubs.forEach((club) => {
            const isChecked = pastSelections.includes(club.name) ? 'checked' : '';

            const div = document.createElement('div');
            div.className = 'club-card';
            // 將社團的「星期幾 (club.day)」透過 data-day 綁定在 input 標籤上
            div.innerHTML = `
                <label style="cursor:pointer; display:flex; align-items:flex-start;">
                    <input type="checkbox" name="clubChoice" value="${club.name}" data-day="${club.day}" ${isChecked} style="width:18px; height:18px; margin-right:12px; margin-top:3px;">
                    <div>
                        <h3 style="margin: 0 0 5px 0; color: var(--header-green); font-size: 16px;">${club.name}</h3>
                        <p style="margin: 0 0 5px 0; font-size: 13px; color: #666;">星期${club.day} | 費用: ${club.fee} | 老師: ${club.teacher}</p>
                        <p style="margin: 0; font-size: 12px; color: #888;">${club.desc}</p>
                    </div>
                </label>
            `;
            clubContainer.appendChild(div);
        });
    }

    function submitForm() {
        if (!isRegistrationOpen) return alert("報名時間已截止！");

        const selectedCheckboxes = document.querySelectorAll('input[name="clubChoice"]:checked');
        if (selectedCheckboxes.length === 0) return alert("請至少選擇一個社團！");
        
        // ============================================
        // 同一星期防呆檢查：阻止報名衝突的時段
        // ============================================
        const selectedDays = [];
        const selectedClubsArray = [];
        
        for (let cb of selectedCheckboxes) {
            const day = cb.getAttribute('data-day'); // 取出星期幾
            if (selectedDays.includes(day)) {
                return alert(`⚠️ 發生時段衝突！\n您重複選擇了「星期${day}」的社團，每天只能報名一個。`);
            }
            selectedDays.push(day);
            selectedClubsArray.push(cb.value);
        }

        const payload = {
            cls: currentClass,
            num: currentStudent.num,
            name: currentStudent.name,
            pwd: verifiedPassword,
            selectedClubs: selectedClubsArray
        };

        document.getElementById('step3').innerHTML = '<h2 style="text-align:center; color:var(--text-grey);">資料處理中，請稍候...</h2>';

        fetch(API_URL, {
            method: 'POST',
            body: JSON.stringify(payload)
        })
        .then(res => res.json())
        .then(data => {
            if (data.status === 'success') {
                document.querySelectorAll('.step-content').forEach(el => el.classList.remove('active'));
                document.getElementById('step-success').classList.add('active');
            } else {
                alert(data.message); 
                location.reload();
            }
        })
        .catch(err => {
            alert("系統發生錯誤，請稍後再試。");
            console.error(err);
        });
    }
</script>

</body>
</html>
